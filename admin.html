<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin | Mi Bella Creación</title>
    <link rel="stylesheet" href="dataStyle.css">
</head>
<body>

    <!-- ===== LOGIN ===== -->
    <section id="login" class="caja">
        <h1>Panel de administración</h1>
        <p class="sub">Mi Bella Creación 🌸</p>
        <form id="login_form">
            <label for="correo">Correo</label>
            <input id="correo" type="email" autocomplete="username" required>
            <label for="clave">Contraseña</label>
            <input id="clave" type="password" autocomplete="current-password" required>
            <button type="submit" class="btn principal">Entrar</button>
            <p id="login_msg" class="msg"></p>
        </form>
    </section>

    <!-- ===== PANEL (solo se ve con sesión iniciada) ===== -->
    <section id="panel" hidden>
        <header class="barra_admin">
            <h1>Admin 🌸</h1>
            <button id="btn_salir" class="btn chico">Salir</button>
        </header>

        <nav class="tabs">
            <button id="tab_pedidos" class="tab activa">Pedidos</button>
            <button id="tab_flores" class="tab">Flores</button>
        </nav>

        <!-- Pedidos -->
        <main id="vista_pedidos">
            <button id="btn_recargar" class="btn chico">↻ Actualizar</button>
            <div id="lista_pedidos"></div>
        </main>

        <!-- Flores -->
        <main id="vista_flores" hidden>
            <form id="form_flor" class="caja">
                <h2>Agregar flor</h2>
                <input id="f_nombre" type="text" placeholder="Nombre" required>
                <input id="f_precio" type="number" min="0" step="0.01" placeholder="Precio" required>
                <input id="f_imagen" type="text" placeholder="Imagen (ej. rosa.jpg)">
                <textarea id="f_desc" rows="3" placeholder="Descripción"></textarea>
                <button type="submit" class="btn principal">Agregar</button>
            </form>
            <div id="lista_admin"></div>
        </main>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="database.js" defer></script>
</body>
</html>
